name: Build & deploy site

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE*', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve Pages base path
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on (build_type: workflow) if it is not configured yet,
          # instead of failing with "Get Pages site failed / Not Found".
          enablement: true

      - name: Build site
        env:
          KG_REPO: ${{ github.repository }}
        run: |
          # configure-pages gives "/" for a user site and "/<repo>" for a project
          # site; build.py normalises either form.
          python3 scripts/build.py \
            --out dist \
            --base '${{ steps.pages.outputs.base_path }}' \
            --site-url '${{ steps.pages.outputs.base_url }}'

      - name: Verify build
        run: python3 scripts/check.py dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
